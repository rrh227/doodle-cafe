<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodle Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="game-container">

    <!-- Title Screen -->
    <div id="screen-title" class="screen active">
      <div class="title-cup">
        <span class="steam s1"></span>
        <span class="steam s2"></span>
        <span class="steam s3"></span>
        <div class="cup-body"></div>
        <div class="cup-handle"></div>
      </div>
      <h1 class="game-title">Doodle Cafe</h1>
      <p class="subtitle">Decorate orders. Impress customers. Keep the cafe open.</p>
      <button id="btn-start" class="btn-primary">Open the Cafe</button>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">

      <!-- Cafe scene backdrop (decorative) -->
      <div id="cafe-scene" aria-hidden="true">
        <div class="scene-wall"></div>
        <div class="scene-window">
          <div class="window-pane">
            <span class="moon"></span>
            <span class="city-block cb1"></span>
            <span class="city-block cb2"></span>
            <span class="city-block cb3"></span>
            <span class="city-block cb4"></span>
            <span class="rain-drop rd1"></span>
            <span class="rain-drop rd2"></span>
            <span class="rain-drop rd3"></span>
            <span class="rain-drop rd4"></span>
            <span class="rain-drop rd5"></span>
            <span class="rain-drop rd6"></span>
          </div>
          <span class="window-bar-h"></span>
          <span class="window-bar-v"></span>
        </div>
        <div class="scene-shelf">
          <span class="shelf-board"></span>
          <span class="jar jar1"></span>
          <span class="jar jar2"></span>
          <span class="bottle bottle1"></span>
          <span class="bottle bottle2"></span>
          <span class="jar jar3"></span>
          <span class="plant"></span>
        </div>
        <div class="hang-lamp lamp1">
          <span class="lamp-cord"></span>
          <span class="lamp-shade"></span>
          <span class="lamp-bulb"></span>
          <span class="lamp-glow"></span>
        </div>
        <div class="hang-lamp lamp2">
          <span class="lamp-cord"></span>
          <span class="lamp-shade"></span>
          <span class="lamp-bulb"></span>
          <span class="lamp-glow"></span>
        </div>
        <div class="scene-counter">
          <span class="counter-top"></span>
          <span class="counter-front"></span>
        </div>
        <div class="scene-vignette"></div>
      </div>

      <div id="hud">
        <div id="hud-score">Score: <span id="score-value">0</span><span id="streak-indicator" class="hidden"></span></div>
        <div id="hud-reputation">
          <span id="reputation-label">Rating:</span>
          <div id="reputation-meter">
            <div id="reputation-fill"></div>
          </div>
          <span id="reputation-value">3.5</span>
        </div>
        <div id="hud-patience">
          <span>Patience:</span>
          <div id="patience-meter">
            <div id="patience-fill"></div>
          </div>
        </div>
        <div id="hud-order">Order #<span id="order-number">1</span></div>
        <button id="btn-mute" title="Toggle sound">🔇 Sound off</button>
      </div>

      <div id="customer-area">
        <div id="customer-slot"></div>
        <div id="speech-bubble">
          <p id="prompt-text">Your order will appear here...</p>
        </div>
      </div>

      <div id="game-area">
        <!-- Left: Base Selection -->
        <div id="base-panel">
          <h3>Choose a base:</h3>
          <div id="base-options"></div>
        </div>

        <!-- Center: Workspace -->
        <div id="workspace">
          <div id="workspace-content">
            <p id="workspace-placeholder">Choose a base item to start!</p>
          </div>
          <div id="topping-counter">0 toppings</div>
        </div>

        <!-- Right: Topping Catalog -->
        <div id="topping-panel">
          <div id="topping-tabs"></div>
          <div id="topping-grid"></div>
        </div>
      </div>

      <div id="bottom-bar">
        <div id="color-palette"></div>
        <button id="btn-serve" class="btn-primary" disabled>Serve</button>
      </div>

      <button id="btn-end-game" class="btn-primary btn-small" style="background-color: #E8A5A5; position: absolute; bottom: 4px; right: 4px;">End Game (debug)</button>

      <!-- Score Feedback Overlay -->
      <div id="score-overlay" class="overlay hidden">
        <div id="score-card">
          <div id="score-stars"></div>
          <p id="score-reaction"></p>
          <div id="score-breakdown"></div>
          <p id="score-total"></p>
          <button id="btn-next-order" class="btn-primary">Next Order</button>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="screen-gameover" class="screen">
      <h2 class="gameover-title">Cafe Closed!</h2>
      <div id="final-stats">
        <p>Final Score: <span id="final-score">0</span></p>
        <p>Orders Served: <span id="final-orders">0</span></p>
        <p>Best Rating: <span id="final-best">0</span> stars</p>
      </div>
      <button id="btn-replay" class="btn-primary">Play Again</button>
    </div>

  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
